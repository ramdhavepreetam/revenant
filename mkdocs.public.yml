site_name: Revenant
site_description: Revenant — a local, offline coding-agent CLI powered by your own Ollama models.
site_url: https://ramdhavepreetam.github.io/revenant-docs/
docs_dir: docs
# PUBLIC docs build (Revenant-only). Companion (aibot-app) pages are intentionally
# omitted from the nav so nothing about the private companion is published. Only the
# 3 public packages are on the mkdocstrings import path; aibot-app is not installed
# in the public build, so its autodoc pages cannot resolve and are not referenced.

theme:
  name: readthedocs
  highlightjs: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/nerva-core/src
            - packages/nerva-agent/src
            - packages/revenant-cli/src
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - fenced_code
  - tables

nav:
  - Home: index.md
  - Install: install.md
  - Architecture: architecture.md
  - Guides:
      - Model Routing: model-routing.md
      - Revenant CLI: revenant-cli.md
  - Design Records:
      - Agent Harness Plan: agent-harness-plan.md
      - "ADR 0001 — Offline Local LLM Interface": adr/0001-offline-local-llm-interface.md
      - "ADR 0003 — Local Agent Harness": adr/0003-local-agent-harness.md
  - API Reference:
      - Overview: api/index.md
      - "core: local_llm_writer": api/local_llm_writer.md
      - "core: aibot_profiles": api/aibot_profiles.md
      - "core: aibot_storage": api/aibot_storage.md
      - "core: aibot_memory": api/aibot_memory.md
      - "agent: agent_router": api/agent_router.md
      - "agent: agent_tools": api/agent_tools.md
      - "agent: agent_protocol": api/agent_protocol.md
      - "agent: agent_fs_tools": api/agent_fs_tools.md
      - "agent: agent_edit_tools": api/agent_edit_tools.md
      - "agent: agent_bash_tool": api/agent_bash_tool.md
      - "agent: agent_capacity": api/agent_capacity.md
      - "agent: agent_native_tools": api/agent_native_tools.md
      - "agent: agent_loop": api/agent_loop.md
      - "cli: revenant": api/agent_cli.md
