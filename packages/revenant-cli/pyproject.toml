[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "revenant-cli"
version = "0.9.0"
description = "Revenant — a local, offline coding-agent CLI powered by your own Ollama models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Preetam Ramdhave" }]
keywords = ["cli", "coding-agent", "llm", "ollama", "local", "offline", "revenant"]
dependencies = ["nerva-core>=0.9.0", "nerva-agent>=0.9.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# `rich` is OPTIONAL: `pip install revenant-cli[rich]` gets the polished live
# console (panels, spinner, real diffs). Without it, the CLI falls back to
# plain-ANSI output — so the base install stays zero required third-party deps.
#
# `tui` is OPTIONAL: `pip install revenant-cli[tui]` adds the full-screen
# interactive terminal (`revenant chat --tui`; ADR-0017). textual is built on
# rich, so [tui] implies [rich]. Without it, chat falls back to the REPL.
[project.optional-dependencies]
rich = ["rich>=13"]
tui = ["textual>=0.60", "rich>=13"]

[project.urls]
Homepage = "https://github.com/ramdhavepreetam/revenant"
Repository = "https://github.com/ramdhavepreetam/revenant"

[project.scripts]
revenant = "revenant_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
