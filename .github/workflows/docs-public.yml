name: Publish public docs

# Builds the Revenant-only (companion-free) docs site and pushes it to the PUBLIC
# ramdhavepreetam/revenant-docs repo, which serves it via GitHub Pages. The code
# repo stays private; only rendered HTML for the public packages is published.
#
# Requires a repo secret DOCS_DEPLOY_TOKEN: a fine-grained PAT with Contents:write
# scoped to the revenant-docs repository.
on:
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - "mkdocs.public.yml"
      - "packages/nerva-core/**/*.py"
      - "packages/nerva-agent/**/*.py"
      - "packages/revenant-cli/**/*.py"
      - "packaging/build-public-docs.sh"
      - ".github/workflows/docs-public.yml"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs toolchain + the 3 PUBLIC packages only
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt
          # aibot-app is intentionally NOT installed — the public build must not need it.
          pip install -e packages/nerva-core -e packages/nerva-agent -e packages/revenant-cli

      - name: Build the companion-free public site
        run: bash packaging/build-public-docs.sh   # -> ./site_public (fails if companion leaks)

      - name: Publish to revenant-docs (gh-pages)
        run: |
          cd site_public
          touch .nojekyll
          git init -q
          git config user.name "docs-bot"
          git config user.email "docs-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish docs from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${DOCS_DEPLOY_TOKEN}@github.com/ramdhavepreetam/revenant-docs.git" HEAD:gh-pages
        env:
          DOCS_DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
