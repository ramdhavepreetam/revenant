name: Build Revenant installers

# Builds the self-contained `revenant` executable for macOS and Windows with
# PyInstaller, and uploads the artifacts. On a tag push (v*), it also attaches
# them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: revenant-macos-arm64
            bin: revenant
          - os: windows-latest
            artifact: revenant-windows-x64
            bin: revenant.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the CLI packages + PyInstaller (isolated)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e packages/nerva-core -e packages/nerva-agent -e packages/revenant-cli

      - name: Build the executable
        run: pyinstaller packaging/revenant.spec --distpath dist_bin --workpath build_bin --noconfirm

      - name: Smoke-test (--help needs no Ollama)
        shell: bash
        run: ./dist_bin/${{ matrix.bin }} --help

      # --- macOS: wrap into a .dmg ---
      - name: Package macOS .dmg
        if: runner.os == 'macOS'
        run: |
          STAGE=$(mktemp -d)
          cp dist_bin/revenant "$STAGE/revenant"; chmod +x "$STAGE/revenant"
          cp packaging/INSTALL-macos.txt "$STAGE/INSTALL.txt" || true
          mkdir -p dist_installers
          hdiutil create -volname "Revenant" -srcfolder "$STAGE" -ov -format UDZO \
            dist_installers/Revenant-macos-arm64.dmg

      # --- Windows: build an installer with Inno Setup (adds revenant to PATH) ---
      - name: Package Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force -Path dist_installers | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\revenant.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist_bin/${{ matrix.bin }}
            dist_installers/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Creating/updating a GitHub Release needs write access to repo contents.
    # Without this the default GITHUB_TOKEN is read-only and the attach step
    # fails with "Resource not accessible by integration" (403).
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          # Create the Release for this tag if it doesn't exist yet, and don't
          # fail the job if some glob matches nothing.
          fail_on_unmatched_files: false
