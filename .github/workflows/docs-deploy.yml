name: Deploy docs

# Builds the MkDocs site and publishes it to THIS repo's GitHub Pages
# (served at https://ramdhavepreetam.github.io/revenant/). Uses the built-in
# GITHUB_TOKEN via the official Pages actions — no PAT or cross-repo secret.
#
# Requires Pages to be set to "GitHub Actions" as its source (Settings → Pages).
on:
  push:
    branches: ["master"]
    paths:
      - "docs_site/**"
      - "mkdocs.yml"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch: {}

# Least-privilege permissions the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deploy; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MkDocs
        run: pip install mkdocs-material
      - name: Build (strict — fails on a broken link/nav)
        run: mkdocs build --strict
      - name: Upload the built site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
