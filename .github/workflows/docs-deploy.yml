name: Deploy docs

# Builds the MkDocs site and publishes it to the SEPARATE public docs repo
# (ramdhavepreetam/revenant-docs, served at the GitHub Pages URL). Runs on pushes
# to master that touch the docs, and can be run manually.
#
# Setup (one-time): this needs write access to the revenant-docs repo, which the
# default GITHUB_TOKEN does not have. Create a secret named DOCS_DEPLOY_TOKEN — a
# fine-grained PAT (or classic PAT with `repo`) that can push to revenant-docs —
# and the deploy step below uses it. Without the secret the job fails clearly.
on:
  push:
    branches: ["master"]
    paths:
      - "docs_site/**"
      - "mkdocs.yml"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gh-deploy needs history to commit to the pages branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Build (strict — fails on a broken link/nav)
        run: mkdocs build --strict

      - name: Deploy to revenant-docs (gh-pages)
        env:
          TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::DOCS_DEPLOY_TOKEN secret is not set — cannot push to revenant-docs."
            echo "Create a PAT with write access to ramdhavepreetam/revenant-docs and add it as the DOCS_DEPLOY_TOKEN secret."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add docs "https://x-access-token:${TOKEN}@github.com/ramdhavepreetam/revenant-docs.git"
          mkdocs gh-deploy --remote-name docs --remote-branch gh-pages --force --no-history
