name: Deploy docs to GitHub Pages

# Builds the MkDocs site and publishes it to GitHub Pages. The API-reference pages
# use mkdocstrings autodoc, which imports the packages at build time — so the job
# installs them (editable) before building. Docs become a PUBLIC site even though
# the repository is private.
on:
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "packages/**/*.py"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: write   # mkdocs gh-deploy pushes to the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gh-deploy needs history for the gh-pages branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs toolchain + the packages (for autodoc imports)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt
          pip install -e packages/nerva-core -e packages/nerva-agent \
                      -e packages/revenant-cli -e packages/aibot-app

      - name: Build (strict) and deploy to gh-pages
        run: mkdocs gh-deploy --force --strict
