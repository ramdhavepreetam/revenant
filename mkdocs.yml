site_name: Revenant
site_description: Revenant — a local, offline coding-agent CLI powered by your own Ollama models. No cloud, no telemetry, no API keys.
site_url: https://ramdhavepreetam.github.io/revenant/
repo_url: https://github.com/ramdhavepreetam/revenant
repo_name: ramdhavepreetam/revenant
copyright: Copyright &copy; Preetam Ramdhave — Revenant is offline and on-prem by design.

docs_dir: docs_site

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      title: On this page
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Overview: index.md
  - Getting Started:
      - Quickstart: getting-started.md
      - Installation: installation.md
      - Configuration: configuration.md
  - Guides:
      - Overview: guides/index.md
      - Run your first coding task: guides/first-task.md
      - Approve, edit, and run commands safely: guides/approvals-and-safety.md
      - Extending Revenant (MCP, skills, loops, graph): guides/extending.md
      - Configure model routing: guides/model-routing.md
      - Work in read-only mode: guides/read-only.md
  - Reference:
      - CLI reference: reference/cli.md
      - Tools reference: reference/tools.md
      - Configuration reference: reference/config.md
  - Architecture: architecture.md
  - Deployment: deployment.md
  - Troubleshooting: troubleshooting.md
  - About:
      - Changelog: about/changelog.md
      - Contributing: about/contributing.md
