site_name: AIBot
site_description: Offline-first local LLM companion, writing tool, and agent harness.
docs_dir: docs
# Repo-relative; the site is generated into ./site (gitignored) or served live.

theme:
  name: readthedocs
  highlightjs: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # Modules live under core/, tts/, apps/ (flat, no package). Add them to
          # the import path so ::: <module> autodoc resolves.
          paths: [core, tts, apps]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - fenced_code
  - tables

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Guides:
      - Model Routing: model-routing.md
      - Revenant CLI: revenant-cli.md
      - Companion Agent: companion-agent.md
  - Design Records:
      - Companion Harness Plan: companion-harness-plan.md
      - Agent Harness Plan: agent-harness-plan.md
      - Knowledge Base: knowledge-base.md
      - "ADR 0001 — Offline Local LLM Interface": adr/0001-offline-local-llm-interface.md
      - "ADR 0002 — Qwen3-TTS Local Voice Engine": adr/0002-qwen3-tts-local-voice-engine.md
      - "ADR 0003 — Local Agent Harness": adr/0003-local-agent-harness.md
  - API Reference:
